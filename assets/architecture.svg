<path d="M536 276C566 276 568 208 592 204" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
<path d="M744 200H782" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
<path d="M924 200H962" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
<g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12" text-anchor="middle">
<rect x="568" y="256" width="94" height="24" rx="12" fill="#0B1120" stroke="#34D399" stroke-opacity=".8"/><text x="615" y="272" fill="#34D399">Supported</text>
<rect x="670" y="256" width="82" height="24" rx="12" fill="#0B1120" stroke="#F87171" stroke-opacity=".8"/><text x="711" y="272" fill="#F87171">Refuted</text>
<rect x="598" y="288" width="138" height="24" rx="12" fill="#0B1120" stroke="#FBBF24" stroke-opacity=".8"/><text x="667" y="304" fill="#FBBF24">Not Enough Info</text></g>
<path d="M669 232V254" stroke="#22D3EE" stroke-opacity=".5" stroke-dasharray="3 3"/>
<g font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12" fill="#8493AD"><text x="20" y="378">Served by</text>
<rect x="92" y="364" width="74" height="22" rx="11" fill="#0B1120" stroke="#2DD4BF" stroke-opacity=".7"/><text x="129" y="379" text-anchor="middle" fill="#2DD4BF">FastAPI</text>
<rect x="174" y="364" width="66" height="22" rx="11" fill="#0B1120" stroke="#22D3EE" stroke-opacity=".7"/><text x="207" y="379" text-anchor="middle" fill="#22D3EE">Docker</text>
<text x="1090" y="378" text-anchor="end">Two-track evidence: trusted corpus for grounding, live search for recency.</text>
<text x="20" y="410">Verdicts come from a dedicated NLI model, not from the generating LLM, so each one stays auditable.</text></g>
</svg>