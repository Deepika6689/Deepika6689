<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="430" viewBox="0 0 1110 430" role="img" aria-labelledby="t d">
<title id="t">AI Misinformation Audit Agent architecture</title>
<desc id="d">An article goes to a claim extractor. Each claim is checked against a ChromaDB trusted corpus and live Serper web search. The evidence goes to a DeBERTa-v3 NLI verifier that returns Supported, Refuted or Not Enough Info. A contradiction detector then compares claims with each other, and a structured audit report is produced. The workflow is orchestrated by LangGraph and served by FastAPI.</desc>
<defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#22D3EE" stroke-opacity=".06"/></pattern>
<style>.flow{animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1110" height="430" rx="14" fill="#05070D"/><rect width="1110" height="430" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1109" height="429" rx="14" fill="none" stroke="url(#neon)" stroke-opacity=".5"/>
<rect x="168" y="52" width="772" height="290" rx="14" fill="#8B5CF6" fill-opacity=".05" stroke="#8B5CF6" stroke-opacity=".6" stroke-dasharray="4 5"/>
<text x="186" y="76" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12" letter-spacing="2" fill="#A78BFA">LANGGRAPH WORKFLOW</text>
<g><rect x="20" y="168" width="128" height="64" rx="10" fill="#0B1120" stroke="#22D3EE" stroke-width="1.5" filter="url(#soft)"/><text x="84.0" y="198.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">Article</text><text x="84.0" y="216.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">input text</text></g>
<g><rect x="190" y="168" width="140" height="64" rx="10" fill="#0B1120" stroke="#2DD4BF" stroke-width="1.5" filter="url(#soft)"/><text x="260.0" y="198.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">Claim Extractor</text><text x="260.0" y="216.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">claim by claim</text></g>
<g><rect x="386" y="92" width="150" height="64" rx="10" fill="#0B1120" stroke="#3B82F6" stroke-width="1.5" filter="url(#soft)"/><text x="461.0" y="122.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">ChromaDB RAG</text><text x="461.0" y="140.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">trusted corpus</text></g>
<g><rect x="386" y="244" width="150" height="64" rx="10" fill="#0B1120" stroke="#3B82F6" stroke-width="1.5" filter="url(#soft)"/><text x="461.0" y="274.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">Serper Search</text><text x="461.0" y="292.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">live web evidence</text></g>
<g><rect x="594" y="168" width="150" height="64" rx="10" fill="#0B1120" stroke="#22D3EE" stroke-width="1.5" filter="url(#soft)"/><text x="669.0" y="198.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">DeBERTa-v3 NLI</text><text x="669.0" y="216.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">verifier</text></g>
<g><rect x="784" y="168" width="140" height="64" rx="10" fill="#0B1120" stroke="#8B5CF6" stroke-width="1.5" filter="url(#soft)"/><text x="854.0" y="198.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">Contradiction</text><text x="854.0" y="216.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">claim vs claim</text></g>
<g><rect x="964" y="168" width="126" height="64" rx="10" fill="#0B1120" stroke="#2DD4BF" stroke-width="1.5" filter="url(#soft)"/><text x="1027.0" y="198.0" text-anchor="middle" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-weight="700" font-size="15" fill="#E6EDF7">Audit Report</text><text x="1027.0" y="216.0" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#8493AD">structured</text></g>
<path d="M148 200H188" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
<path d="M330 200C356 200 360 124 384 124" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
<path d="M330 200C356 200 360 276 384 276" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity=".9" stroke-dasharray="6 5" class="flow" marker-end="url(#ah)"/>
