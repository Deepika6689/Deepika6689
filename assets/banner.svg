<clipPath id="r"><rect width="1200" height="380" rx="14"/></clipPath>
<style>
.fade1{animation:f 1s .2s both} .fade2{animation:f 1s .6s both} .fade3{animation:f 1s 1s both}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:p 1.8s ease-in-out infinite} @keyframes p{50%{opacity:.25}}
.cur{animation:c 1s steps(1) infinite} @keyframes c{50%{opacity:0}}
.sweep{animation:s 6s linear infinite} @keyframes s{from{transform:translateX(-600px)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
